# bioaccx example config — adapt paths and parameters to your setup
# =============================================================================
# FOUNDATION MODEL
# =============================================================================
# Use registry_id to load all defaults for a known model in one line.
# Run `python -c "from bioaccx.registry import list_registry_ids; print(list_registry_ids())"``
# to see all available IDs.
# Any field set alongside registry_id overrides the registry default.

# --- BirdNET v2.4 ONNX — registry shorthand (downloads from HuggingFace) ---
foundation_model:
  registry_id: "0xbb00"

# --- BirdNET v2.4 ONNX — registry shorthand with local override ---
# foundation_model:
#   registry_id: "0xbb00"
#   source: local
#   path: /local/path/to/birdnet_backbone.onnx

# --- BirdNET v2.4 ONNX — fully explicit (equivalent to registry_id: "0xbb00") ---
# foundation_model:
#   name: birdnet
#   version: "2.4"
#   data_type: FP32
#   format: onnx
#   source: huggingface
#   hf_repo: biodiversica/BirdNET-onnx-backbone
#   hf_filename: model_backbone.onnx
#   # hf_revision: main                    # branch / tag / commit (optional)
#   sample_rate: 48000
#   window_seconds: 3.0                    # alternative: window_samples: 144000
#   input_name: INPUT
#   output_name: embedding
#   embedding_size: 1024

# --- BirdNET v2.4 tflite (full model with classifier head) — registry shorthand ---
# foundation_model:
#   registry_id: "0xbb01"
#   path: /local/path/to/BirdNET_GLOBAL_6K_V2.4_Model_FP32.tflite
#   # tflite_output_tensor_offset: -1 is set automatically by the registry

# --- Perch v2.0 ONNX — registry shorthand (downloads from HuggingFace) ---
# foundation_model:
#   registry_id: "0xbb10"

# --- Perch v2.0 tflite (full model) — needed for a tflite full-model export ---
# foundation_model:
#   registry_id: "0xbb12"
#   # The embedding is already the first output, so no offset is needed.
#   # The 14795-class head and the auxiliary outputs are trimmed away at load;
#   # set tflite_trim_to_embedding: false to run the model exactly as shipped.

# =============================================================================
# DATASET
# =============================================================================

dataset:
  data_dir:
    - /path/to/audio/directory1

  # ---------------------------------------------------------------------------
  # Label mode
  # ---------------------------------------------------------------------------
  # subfolders    — one subfolder per class (or train/test/<class> structure)
  # file_per_label — file1.wav + file1.txt (rows: start_time, end_time, label)
  # table         — CSV/TSV with filename, label, start_time, end_time columns
  label_mode: file_per_label

  # For label_mode: table
  # table_file: /path/to/annotations.csv
  # filename_col: filename
  # label_col: label
  # start_col: start_time
  # end_col: end_time
  # split_col: split                      # optional; values: train | test

  # ---------------------------------------------------------------------------
  # Append to existing exported dataset
  # ---------------------------------------------------------------------------
  # Only samples not already present are added; the merged set is used for
  # training. Existing split assignments are preserved.
  # append_dataset_path: /path/to/existing_exported_dataset

  # ---------------------------------------------------------------------------
  # Multiple sources in one run  (optional — replaces chained append runs)
  # ---------------------------------------------------------------------------
  # Use `sources:` to combine several heterogeneous sources in a single run.
  # Each source inherits the fields set above and overrides them with its own,
  # so you can mix label modes, preprocessing, and augmentation per source.
  # Sources are loaded, split, and augmented independently, then merged.
  #
  # Run-level fields are taken ONLY from the top-level `dataset` block and are
  # NOT overridable per source (they keep the run consistent):
  #   test_ratio, random_seed, append_dataset_path, embedding_workers,
  #   embeddings_cache_path, ext_cache_dir, xc_api_key,
  #   arbimon_credentials_path, audio_extensions
  # Everything else is per-source, including ssh_host/ssh_user/ssh_port/
  # ssh_key_path (so you can mix local and remote sources), filter/speed,
  # overlap, label columns, and augmentation.
  #
  # Set `augmentation: null` in a source to opt out of an inherited augmentation.
  #
  # sources:
  #   - data_dir: /path/with/class/subfolders
  #     label_mode: subfolders
  #     augmentation: null                  # no augmentation for this source
  #   - data_dir: /path/with/audacity/labels
  #     label_mode: file_per_label
  #     augmentation: null
  #   - data_dir: /path/to/augment
  #     label_mode: subfolders
  #     augmentation:                       # augment only this source
  #       augmentation_dir: /path/to/noise
  #       snr_levels: [20, 10, 3]
  #   - data_dir: /remote/audio              # remote source over SSH
  #     label_mode: subfolders
  #     ssh_host: host.example
  #     ssh_user: me

  # ---------------------------------------------------------------------------
  # Remote audio sources (iNaturalist, Xeno-canto, Arbimon)
  # ---------------------------------------------------------------------------
  # ext_table_file: CSV/TSV with any combination of:
  #   observation_id (iNaturalist), xc_id (Xeno-canto), filename (local),
  #   or stream_id + date + time (Arbimon).
  # label falls back to taxon scientific name / stream_id if empty.
  # start_time, end_time, split work the same as in table mode.
  # ext_table_file: /path/to/observations.csv
  # obs_id_col: observation_id            # default (iNaturalist)
  # sound_index_col: sound_index          # default (iNat only; 0-based, default 0)
  # xc_id_col: xc_id                      # default (Xeno-canto; accepts XC12345 or 12345)
  ext_cache_dir: .cache/ext              # shared cache for all remote audio

  # Xeno-canto API v3 key — needed for scientific name lookup.
  # Without a key, audio is still downloaded but the label falls back to "xc_<id>".
  # Register at https://xeno-canto.org/explore/api
  # xc_api_key: YOUR_KEY_HERE

  # Arbimon / rfcx — rows with a non-empty stream_id are treated as Arbimon rows.
  # Required columns: stream_id, date (YYYY-MM-DD), time (HH:MM or HH:MM:SS),
  #                   utc_offset (hours, e.g. -3 or +5.5; defaults to 0)
  # Example row: abc123xyz,2024-01-15,10:30:00,-3,My Species,0.0,3.0
  # Authenticate once: import rfcx; rfcx.Client().authenticate(persisted_credentials_path="~/.rfcx_credentials")
  # Install: pip install https://github.com/rfcx/rfcx-sdk-python/releases/download/0.3.1/rfcx-0.3.1-py3-none-any.whl
  # arbimon_credentials_path: ~/.rfcx_credentials
  # arbimon_stream_id_col: stream_id      # default
  # arbimon_date_col: date                # default
  # arbimon_time_col: time                # default
  # arbimon_utc_offset_col: utc_offset    # default

  # ---------------------------------------------------------------------------
  # Audio preprocessing  (applied in order: filter → speed → chunk)
  # ---------------------------------------------------------------------------
  audio_extensions: [wav, flac, mp3, ogg]

  # Butterworth filter applied before chunking
  # filter: hpf | lpf | bpf  (high-pass, low-pass, band-pass)
  # filter_freq: cutoff Hz for hpf/lpf (scalar); [low_hz, high_hz] for bpf
  # filter_order: 5           # default
  # filter: hpf
  # filter_freq: 1000.0
  # filter: bpf
  # filter_freq: [500.0, 8000.0]

  # Playback speed multiplier (default: 1.0)
  # > 1.0 → faster / shorter duration; < 1.0 → slower / longer.
  # Label start/end times are scaled: new_time = old_time / speed.
  # speed: 1.0

  # ---------------------------------------------------------------------------
  # SSH / SFTP remote data_dir
  # ---------------------------------------------------------------------------
  # When ssh_host is set, all data_dir paths above are treated as remote paths
  # on the SSH server.  Files are mirrored to a local temp directory before the
  # pipeline runs; unchanged files (same size) are not re-downloaded.
  # Requires: pip install bioaccx[ssh]   (or: pip install paramiko)
  #
  # ssh_host: 192.168.1.10
  # ssh_user: myuser
  # ssh_port: 22                          # default
  # ssh_key_path: ~/.ssh/id_rsa           # if omitted, uses SSH agent / default key

  # Fractional overlap between consecutive windows (file_per_label / table only)
  overlap: 0.5

  # ---------------------------------------------------------------------------
  # Chunking and splitting
  # ---------------------------------------------------------------------------
  test_ratio: 0.2
  random_seed: 42

  # ---------------------------------------------------------------------------
  # Augmentation (optional)
  # ---------------------------------------------------------------------------
  # Expands the training set by mixing each sample with every noise file at
  # every listed SNR level.  One augmented copy is produced per combination.
  # The noise start offset is chosen randomly but reproducibly (random_seed).
  #
  # augmentation_dir               — folder containing noise WAV files (one pass per file).
  #                                  Optional when augmentation_labels is set.
  # augmentation_labels            — labels of THIS dataset whose audio is used as additional noise
  #                                  sources, combined with augmentation_dir (default: null). These
  #                                  labels are not augmented themselves but stay as trainable classes.
  # snr_levels                     — list of signal-to-noise ratios in dB (power-based)
  # keep_original                  — also keep the unaugmented sample (default: true)
  # augment_test                   — apply the same augmentation to the test set (default: false)
  # skip_labels                    — labels to exclude from augmentation; all others are augmented (default: null)
  # concatenate_augmentation_dir   — concatenate all files in augmentation_dir into a single noise
  #                                  source instead of treating each file separately (default: false).
  #                                  If a sibling Audacity .txt label file exists for an audio file,
  #                                  only the labeled segments are used; otherwise the entire file
  #                                  is included. The concatenated array is held in memory only.
  # random_augmentation_dir        — shuffle the files in augmentation_dir once (using random_seed)
  #                                  and assign one file per (sample, SNR) pair round-robin
  #                                  (default: false). Produces the same expansion factor as
  #                                  concatenate_augmentation_dir (N_samples × N_snr_levels) while
  #                                  drawing from individual files rather than a merged track.
  #
  # augmentation:
  #   augmentation_dir: /path/to/noise_files
  #   augmentation_labels: [rain, wind]   # reuse these dataset labels as noise (optional)
  #   snr_levels: [0, 10, 20]
  #   keep_original: true
  #   augment_test: false
  #   skip_labels: [background, noise]
  #   concatenate_augmentation_dir: false
  #   random_augmentation_dir: false

  # ---------------------------------------------------------------------------
  # Random sample shift
  # ---------------------------------------------------------------------------
  # When true, samples shorter than the foundation model window are placed at a
  # random start offset within the window instead of always starting at position
  # zero.  The offset is derived deterministically from random_seed so results
  # are reproducible.  Augmented copies of the same sample each receive a
  # distinct offset, since the noise file and SNR are included in the hash.
  #
  # random_sample_shift: false

  # ---------------------------------------------------------------------------
  # Embeddings 
  # ---------------------------------------------------------------------------
  # Parallel workers for embedding extraction (capped to available CPU cores)
  embedding_workers: 4

  # Load pre-computed embeddings instead of recomputing.
  # npy mode  — point to the directory containing .npy files
  # sqlite mode — point to the .db file; filename must contain the backbone
  #               name and version or the cache will be ignored with a warning
  # embeddings_cache_path: <output_dir>/embeddings
  # embeddings_cache_path: <output_dir>/birdnet_2.4_embeddings.db

# =============================================================================
# TRAINING
# =============================================================================

training:
  # classifier: keras | sklearn | both
  classifier: keras

  # ---------------------------------------------------------------------------
  # Keras classifier head
  # ---------------------------------------------------------------------------
  keras:
    hidden_units: 0                      # 0 = single linear layer (no hidden layer)
    dropout: 0.25
    epochs: 50
    batch_size: 32
    learning_rate: 0.0001
    # output_activation: null (logits, default) | sigmoid | softmax
    #                    | grouped_softmax  (requires label_groups below)
    output_activation: null

    # --- Grouped softmax -----------------------------------------------------
    # Softmax within each group, groups independent of one another. Use it when
    # some labels are mutually exclusive but others can co-occur — e.g. several
    # call types per species: one species emits one call at a time, but two
    # species can overlap in the same window.
    #
    # Each group gains a synthetic "<group>_none" output column, so the head
    # emits sum(len(members) + 1) values. Members of one group can never both
    # score high (their group sums to 1); members of different groups can.
    #
    # Training labels not listed in any group are background: they get no output
    # column and instead supply the "none" target for every group. Nothing needs
    # to change in the dataset section — labels are still discovered from the
    # data, and a label you add later is treated as background automatically.
    #
    # A group of one member is simply an independent binary detector.
    #
    # Not compatible with: focal_loss, label_smoothing, upsampling_ratio.
    #
    # label_groups:
    #   SPECIES_A: [SPECIES_A1, SPECIES_A2, SPECIES_A3]
    #   SPECIES_B: [SPECIES_B1, SPECIES_B2]
    #   SPECIES_C: [SPECIES_C1, SPECIES_C2, SPECIES_C3]
    # Strip the activation before export so the head emits logits, as
    # BirdNET-Analyzer does (no-op when output_activation is null)
    export_logits: false
    normalize_embeddings: true   # Z-score normalization of input embeddings (default: true)
    # focal_loss: false            # replace cross-entropy with focal loss
    # focal_loss_gamma: 2.0
    # focal_loss_alpha: 0.25
    # label_smoothing: false       # smooth one-hot targets before training
    # label_smoothing_alpha: 0.1
    # mixup: false                 # mixup augmentation on training embeddings
    # mixup_ratio: 0.25
    # mixup_alpha: 0.2
    # upsampling_ratio: 0.0        # upsample minority classes (0 = disabled)
    # upsampling_mode: repeat      # repeat | mean | linear | smote

  # ---------------------------------------------------------------------------
  # sklearn (logistic regression) classifier head
  # ---------------------------------------------------------------------------
  sklearn:
    C: 1.0
    max_iter: 2000
    solver: lbfgs

# =============================================================================
# OUTPUT
# =============================================================================

output:
  output_path: ./custom_models
  model_name: test_classifier
  model_version: "0.1"

  # ---------------------------------------------------------------------------
  # Model export
  # ---------------------------------------------------------------------------
  # output_type:   head = classifier head only (takes embedding as input)
  #                full = foundation + classifier merged into one model
  #                both = save both
  output_type: both
  # output_format: onnx | tflite | both
  output_format: onnx

  # Output precision(s) of the exported model/classifier: any subset of
  # [FP32, FP16, INT8]. Each precision produces a separate file tagged with the
  # precision in its name (e.g. ..._keras_head_fp16.onnx). When omitted, the
  # foundation model's data_type is used. INT8 = dynamic/weight-only quantization.
  # data_types: [FP32, FP16, INT8]

  # Labels to exclude from the exported model output (still used during training)
  exclude_labels: [background, noise, unknown]
  #
  # With a grouped head this is matched against the *group* output labels, so it
  # is how the "<group>_none" columns are dropped from the exported model:
  #   exclude_labels: [SPECIES_A_none, SPECIES_B_none, SPECIES_C_none]
  # The per-group softmax runs before the gather, so the remaining columns are
  # still calibrated probabilities and P(none) stays recoverable as
  # 1 - sum(that group's remaining columns). Cannot be combined with
  # export_logits on a grouped head (that would gather raw logits instead).

  # ---------------------------------------------------------------------------
  # Dataset export
  # ---------------------------------------------------------------------------
  # Export chunked audio as WAV files in <output_dir>/dataset/train/<label>/
  export_dataset: false

  # ---------------------------------------------------------------------------
  # Embedding export
  # ---------------------------------------------------------------------------
  # Save computed embeddings for reuse in future runs
  export_embeddings: false
  # Storage format: npy (one file per sample) or sqlite (single portable .db file)
  embeddings_format: sqlite
  # Output directory for npy files, or parent directory for the sqlite .db file.
  # Defaults to <output_dir>/embeddings (npy) or <output_dir> (sqlite).
  # The sqlite filename is set automatically to <name>_<version>_embeddings.db.
  # embeddings_path: /custom/path/to/embeddings
  # In --embeddings mode, an existing store at the resolved path is reused as-is
  # (only UMAP is rebuilt over it). Set true to recompute and overwrite it.
  embeddings_overwrite: false

  # ---------------------------------------------------------------------------
  # Merge (--merge flag only)
  # ---------------------------------------------------------------------------
  # Path to an existing ONNX classifier head when using --merge (no training)
  # head_path: /path/to/classifier_head.onnx

# =============================================================================
# UMAP (--embeddings flag only)
# =============================================================================
# Parameters for the optional UMAP projection produced by
# `bioaccx config.yaml --embeddings`. Disabled by default — UMAP and plotting
# require the optional extra:  pip install bioaccx[umap]  (or uv sync --extra umap).
# Set enabled: true to compute the UMAP data CSV and scatter-plot PNG.
umap:
  enabled: false         # set true (and install the [umap] extra) to compute UMAP
  n_neighbors: 15        # local vs. global structure (higher = more global)
  min_dist: 0.1          # how tightly points may pack together
  n_components: 2        # output dimensionality (2 for the scatter plot)
  metric: euclidean      # distance metric used to compare embeddings
  # random_seed: 42      # defaults to dataset.random_seed when unset
