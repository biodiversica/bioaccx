# bioaccx example config — adapt paths and parameters to your setup

# foundation_model:
#   name: birdnet
#   version: "2.4"
#   # format: onnx | tflite | protobuf (TF SavedModel)
#   format: onnx
#   # source: local | huggingface
#   source: local
#   # path: /path/to/birdnet_backbone.onnx
#   path: /path/to/birdnet_backbone.onnx
#   # --- OR from Hugging Face Hub ---
#   # source: huggingface
#   # hf_repo: biodiversica/birdnet-backbone
#   # hf_filename: birdnet_backbone.onnx   # optional; default: model.onnx
#   # hf_revision: main                    # branch / tag / commit (optional)

#   sample_rate: 48000
#   window_seconds: 3.0         # alternative: window_samples: 144000
#   input_name: INPUT
#   output_name: embedding
#   embedding_size: 1024

# --- Perch example ---
foundation_model:
  name: perch
  version: "2.0"
  format: onnx
  source: local
  path: /path/to/perch_backbone.onnx
  sample_rate: 32000
  window_seconds: 5.0
  input_name: inputs
  output_name: embedding
  embedding_size: 1536

dataset:
  data_dir: 
    - /path/to/audio/directory1
  
  # label_mode options:
  #   subfolders   — one subfolder per class (or train/test/class_a structure)
  #   file_per_label — file1.wav + file1.txt (rows: start_time, end_time, label)
  #   table        — CSV/TSV with filename, label, start_time, end_time columns
  label_mode: file_per_label

  # For label_mode: table
  # table_file: /path/to/annotations.csv
  # filename_col: filename
  # label_col: label
  # start_col: start_time
  # end_col: end_time
  # split_col: split     # optional; values: train | test

  # Append new samples to an existing exported dataset (train/test subfolders
  # layout). Only samples not already present are added; the merged set is used
  # for training. Existing split assignments are preserved.
  # append_dataset_path: /path/to/existing_exported_dataset

  # Remote audio table — CSV/TSV that may contain any combination of:
  #   iNaturalist rows (observation_id), Xeno-canto rows (xc_id),
  #   and local filename rows (filename).
  # label falls back to taxon scientific name for remote rows if empty.
  # start_time, end_time, split work the same as in table mode.
  # ext_table_file: /path/to/observations.csv
  # obs_id_col: observation_id      # default (iNaturalist)
  # sound_index_col: sound_index    # default (iNat only; 0-based, default 0)
  # xc_id_col: xc_id               # default (Xeno-canto; accepts XC12345 or 12345)
  ext_cache_dir: .cache/ext   # default (shared cache for all remote audio)
  # xc_api_key: YOUR_KEY_HERE              # Xeno-canto API v3 key (needed for scientific name lookup)
  #                                        # Register at https://xeno-canto.org/explore/api
  #                                        # Without a key, audio is still downloaded but the label
  #                                        # falls back to "xc_<id>" unless set in the table.

  # Arbimon / rfcx — download recordings from an Arbimon project.
  # Rows in ext_table_file with a non-empty stream_id column are treated as Arbimon rows.
  # Required columns (defaults shown):
  #   stream_id  — Arbimon stream (recording site) ID
  #   date       — recording date in local time (YYYY-MM-DD)
  #   time       — recording start time in local time (HH:MM or HH:MM:SS)
  #   utc_offset — UTC offset in hours for the local time (e.g. -3, +5.5); defaults to 0
  # label / start_time / end_time / split work the same as for other remote sources.
  # The label falls back to stream_id if not set in the table.
  #
  # Example ext_table_file row:
  #   stream_id,date,time,utc_offset,label,start_time,end_time
  #   abc123xyz,2024-01-15,10:30:00,-3,My Species,0.0,3.0
  #
  # Authentication: run once to create the credentials file:
  #   import rfcx; rfcx.Client().authenticate(persisted_credentials_path="~/.rfcx_credentials")
  # Install rfcx SDK:
  #   pip install https://github.com/rfcx/rfcx-sdk-python/releases/download/0.3.1/rfcx-0.3.1-py3-none-any.whl
  #
  # arbimon_credentials_path: ~/.rfcx_credentials
  # arbimon_stream_id_col: stream_id   # default
  # arbimon_date_col: date             # default
  # arbimon_time_col: time             # default
  # arbimon_utc_offset_col: utc_offset # default
 
  audio_extensions: [wav, flac, mp3, ogg]

  # Audio preprocessing: applied in order filter → speed → chunks.
  # filter: hpf | lpf | bpf  (high-pass, low-pass, band-pass Butterworth)
  # filter_freq: cutoff Hz for hpf/lpf (scalar); [low_hz, high_hz] for bpf
  # filter_order: Butterworth filter order (default: 5)
  # filter: hpf
  # filter_freq: 1000.0
  # filter_order: 5
  # filter: bpf
  # filter_freq: [500.0, 8000.0]
  #
  # speed: playback speed multiplier (default: 1.0).
  #   > 1.0 → faster / shorter duration; < 1.0 → slower / longer.
  #   Label start/end times are scaled: new_time = old_time / speed.
  # speed: 1.0

  # Fractional overlap between consecutive windows (file_per_label / table only)
  overlap: 0.5
  # Parallel workers for embedding extraction (capped to available CPU cores)
  embedding_workers: 4
  # Load pre-computed .npy embeddings from this directory instead of recomputing
  embeddings_cache_path: .cache/embeddings
  test_ratio: 0.2
  random_seed: 42

training:
  # classifier: keras | sklearn | both
  classifier: both

  keras:
    hidden_units: 256     # set to 0 for a single linear layer
    dropout: 0.25
    epochs: 50
    batch_size: 32
    learning_rate: 0.0001
    # output_activation: null (logits, default) | sigmoid | softmax
    output_activation: null

  sklearn:
    C: 1.0
    max_iter: 2000
    solver: lbfgs

output:
  output_path: ./custom_models
  model_name: test_classifier
  model_version: "0.1"
  # output_type: head | full | both
  #   head = classifier head only (takes embedding as input)
  #   full = foundation + classifier merged into one model
  output_type: both
  # output_format: onnx | tflite | both
  output_format: onnx
  # Labels to exclude from the exported model output (still used during training)
  exclude_labels: [background, noise, unknown]
  # Export chunked audio samples as WAV files in label subfolders under
  # output_dir/exported_dataset/train/<label>/ and .../test/<label>/
  export_dataset: false
  # Save computed embeddings as .npy files for reuse in future runs
  export_embeddings: false
  # Directory for exported embeddings; defaults to <output_dir>/embeddings
  # embeddings_path: /path/to/save/embeddings
  # Classification head path when using --merge
  # head_path: /path/to/classifier_head.onnx
