[project]
name = "bioaccx"
version = "0.2.1"
description = "Train and share custom bioacoustic classifiers built on pre-trained foundation models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "onnx>=1.15",
    "onnxconverter-common>=1.14",
    # INT8 ONNX export: onnxruntime.quantization imports sympy, but onnxruntime
    # no longer declares it as a dependency.
    "sympy>=1.12",
    "scikit-learn>=1.4",
    "skl2onnx>=1.17",
    # tensorflow-cpu publishes wheels for x86-64 Linux and Windows only; macOS
    # and ARM Linux take the full package, which is CPU-only there anyway.
    "tensorflow-cpu>=2.16; sys_platform == 'win32' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "tensorflow>=2.16; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'aarch64')",
    "tf2onnx>=1.16",
    "pyyaml>=6.0",
    "huggingface-hub>=0.20",
    "kagglehub>=1.0.1",
    "typer>=0.29",
]

[project.urls]
Homepage = "https://github.com/biodiversica/bioaccx"
Documentation = "https://github.com/biodiversica/bioaccx/tree/master/docs"
Issues = "https://github.com/biodiversica/bioaccx/issues"

[project.scripts]
bioaccx = "bioaccx.cli:main"

[project.optional-dependencies]
# ONNX Runtime backend — install exactly one:
#   uv sync --extra cpu   (default, no GPU required)
#   uv sync --extra gpu   (CUDA 12; driver-only, libs are bundled in onnxruntime-gpu >= 1.19)
cpu = ["onnxruntime>=1.17"]
gpu = ["onnxruntime-gpu>=1.19"]
# UMAP projection + plotting for `bioaccx embeddings` (enable with umap.enabled: true):
#   pip install bioaccx[umap]   /   uv sync --extra umap
umap = ["umap-learn>=0.6", "matplotlib>=3.11.0"]
# Browser GUI (`bioaccx gui`): configure, run and analyze over the same config files.
#   uv tool install "bioaccx[cpu,gui]"   /   uv sync --extra gui
gui = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "ruamel.yaml>=0.18",
]
# rfcx SDK is not on PyPI; install from the GitHub release wheel:
# pip install https://github.com/rfcx/rfcx-sdk-python/releases/download/0.3.1/rfcx-0.3.1-py3-none-any.whl
arbimon = []
# Remote data_dir over SSH/SFTP (dataset.ssh_host):
#   pip install "bioaccx[ssh]"   /   uv sync --extra ssh
ssh = ["paramiko>=5.0.0"]

[dependency-groups]
# The ONNX runtime comes from the cpu or gpu extra, never from here: a runtime
# in this group would be installed next to onnxruntime-gpu by `uv sync --extra gpu`.
dev = [
    "pytest>=9.0.3",
    "pytest-xdist>=3.8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# cpu and gpu provide the same import; only one may be active at a time.
conflicts = [[{extra = "cpu"}, {extra = "gpu"}]]

[tool.hatch.build.targets.sdist]
# Editor and agent settings are per-checkout, not part of the source release.
exclude = [".claude", ".vscode", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that train Keras models or run the full pipeline (skip with -m 'not slow')",
]
filterwarnings = [
    # Keras/NumPy 2.x incompatibility — fired on every training step, not actionable
    "ignore::DeprecationWarning:keras",
    # tf.lite.Interpreter deprecation — tracked upstream, not actionable here
    "ignore::UserWarning:tensorflow",
    # sklearn precision undefined when a class has no predicted samples in small test sets
    "ignore::sklearn.exceptions.UndefinedMetricWarning",
]
