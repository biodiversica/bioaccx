name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # Mondays
  # release.yml runs this first, and publishes the wheel built here.
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra cpu --extra gui --extra umap
      # The slow tests train real Keras heads and run the whole pipeline; the
      # suite is about a minute, so they run everywhere.
      - name: Test
        run: uv run pytest -n auto

  # The installer ignores uv.lock and takes the newest releases, so test those
  # too. The weekly run catches a dependency release between commits.
  tests-latest:
    name: tests / newest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv sync --upgrade --extra cpu --extra gui --extra umap
      - name: Test
        run: uv run pytest -n auto

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check the version agrees everywhere
        run: |
          version=$(uv version --short)
          code=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' bioaccx/__init__.py)
          if [ "$version" != "$code" ]; then
            echo "::error::pyproject.toml says $version, bioaccx/__init__.py says $code"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # What a new user does: run the installer on a machine with no Python set
  # up, then start the GUI. The wheel stands in for the PyPI release.
  installer:
    name: installer / ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Run install.sh
        if: runner.os != 'Windows'
        run: |
          BIOACCX_YES=1 BIOACCX_PACKAGE="bioaccx[cpu,gui,umap] @ $(ls "$PWD"/dist/*.whl)" sh scripts/install.sh
      # The README's command as a user pastes it, on this commit's script
      # served the way a release serves it. See .github/scripts/readme-command.ps1.
      - name: Run install.ps1 with the README command
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, the one every Windows machine has.
        shell: powershell
        run: |
          $env:BIOACCX_YES = "1"
          $env:BIOACCX_PACKAGE = "bioaccx[cpu,gui,umap] @ $((Get-ChildItem dist\*.whl).FullName)"
          powershell -NoProfile -ExecutionPolicy ByPass -File .github\scripts\readme-command.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The launcher is in place, with the logo
        run: |
          case "$RUNNER_OS" in
            Linux)
              test -f "$HOME/.local/share/applications/bioaccx.desktop"
              grep -qx "Icon=bioaccx" "$HOME/.local/share/applications/bioaccx.desktop"
              test -f "$HOME/.local/share/icons/hicolor/scalable/apps/bioaccx.svg"
              test -f "$HOME/.local/share/icons/hicolor/512x512/apps/bioaccx.png" ;;
            macOS)   test -x "$HOME/Desktop/bioaccx.command" ;;
            Windows)
              test -f "$USERPROFILE/Desktop/bioaccx.lnk"
              test -f "$LOCALAPPDATA/bioaccx/bioaccx.ico" ;;
          esac

      - name: The installed command runs and serves the GUI
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bioaccx --version
          bioaccx registry
          cd "$HOME/bioaccx"
          bioaccx gui --no-open --port 8770 > gui.log 2>&1 &
          for _ in $(seq 90); do
            curl -fsS http://127.0.0.1:8770/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8770/ | grep -q bioaccx || { cat gui.log; exit 1; }

      # Uninstalling never takes the work folder. "all" also takes bioaccx's
      # backbones from the Hugging Face cache, and no other model there; "1",
      # the README's Windows command, keeps them.
      - name: Uninstall with install.sh
        if: runner.os != 'Windows'
        run: |
          pkill -f "bioaccx gui" || true
          case "$RUNNER_OS" in
            Linux) launcher="$HOME/.local/share/applications/bioaccx.desktop" ;;
            macOS) launcher="$HOME/Desktop/bioaccx.command" ;;
          esac
          hub="$HOME/.cache/huggingface/hub"
          # The GUI check downloads no model, so stand-ins: one to take, one to keep.
          mkdir -p "$hub/models--biodiversica--Perch-onnx-backbone" "$hub/models--someone--else"
          BIOACCX_YES=1 BIOACCX_UNINSTALL=all sh scripts/install.sh
          test ! -e "$HOME/.local/bin/bioaccx"
          test ! -e "$launcher"
          if [ "$RUNNER_OS" = Linux ]; then
            test ! -e "$HOME/.local/share/icons/hicolor/scalable/apps/bioaccx.svg"
            test ! -e "$HOME/.local/share/icons/hicolor/512x512/apps/bioaccx.png"
          fi
          test ! -e "$hub/models--biodiversica--Perch-onnx-backbone"
          test -d "$hub/models--someone--else"
          test -d "$HOME/bioaccx"
      - name: Uninstall with the README command
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # The GUI the step above started: Windows will not delete a running program.
          Get-Process bioaccx, python -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $env:BIOACCX_YES = "1"
          powershell -NoProfile -ExecutionPolicy ByPass -File .github\scripts\readme-command.ps1 -Uninstall
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Gone = @(
              (Join-Path $HOME ".local\bin\bioaccx.exe"),
              (Join-Path ([Environment]::GetFolderPath("Desktop")) "bioaccx.lnk"),
              (Join-Path ([Environment]::GetFolderPath("Programs")) "bioaccx.lnk"),
              (Join-Path $env:LOCALAPPDATA "bioaccx\bioaccx.ico")
          )
          foreach ($Path in $Gone) {
              if (Test-Path $Path) { throw "still there after uninstalling: $Path" }
          }
          if (-not (Test-Path (Join-Path $HOME "bioaccx"))) { throw "the work folder went too" }
